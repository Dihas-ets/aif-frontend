        <!--====== Slick-popup css ======-->

        <!--====== Magnific-popup css ======-->

        <!--====== Animate css ======-->

         <style>
    body {
      background: linear-gradient(135deg, #e82c25, #ff6a59);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: 'Poppins', sans-serif;
      overflow: hidden;
    }
    .error-container {
      text-align: center;
      position: relative;
      z-index: 2;
    }
    .error-code {
      font-size: 10rem;
      font-weight: 900;
      animation: pulse 2s infinite;
      background: linear-gradient(90deg, #fff, #ffeaea);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .error-message {
      font-size: 1.5rem;
      margin-bottom: 20px;
      animation: fadeIn 2s ease-in-out;
    }
    .btn-home {
      background: #fff;
      color: #e82c25;
      font-weight: bold;
      padding: 12px 25px;
      border-radius: 30px;
      transition: all 0.3s ease;
    }
    .btn-home:hover {
      background: #e82c25;
      color: #fff;
      box-shadow: 0 0 15px rgba(255,255,255,0.7);
    }
    /* Animations */
    @keyframes pulse {
      0%, 100% { transform: scale(1); text-shadow: 0 0 20px rgba(255,255,255,0.4); }
      50% { transform: scale(1.05); text-shadow: 0 0 40px rgba(255,255,255,0.7); }
    }
    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }
    .floating-shape {
      position: absolute;
      border-radius: 50%;
      background: rgba(255,255,255,0.1);
      animation: float 6s infinite ease-in-out;
    }
    .shape1 { width: 150px; height: 150px; top: 10%; left: 15%; animation-delay: 0s; }
    .shape2 { width: 100px; height: 100px; bottom: 20%; right: 20%; animation-delay: 2s; }
    .shape3 { width: 200px; height: 200px; top: 40%; right: 10%; animation-delay: 4s; }
    @keyframes float {
      0%, 100% { transform: translateY(0) rotate(0deg); }
      50% { transform: translateY(-30px) rotate(20deg); }
    }
  </style>
    </head>
    <body>
        <!--====== Start Preloader ======-->
        <div class="preloader">
            <div class="loader">
                <img src="../common/images/loader.png" alt="loader">
            </div>
        </div><!--====== End Preloader ======-->
        <!--====== Start Overlay ======-->
        <div class="offcanvas__overlay"></div>
        <!--====== Search From ======-->
		<div class="modal fade search-modal" id="search-modal">
            <div class="modal-dialog modal-dialog-centered">
                <div class="modal-content">
                    <form>
                        <div class="form-group">
                        	<input type="search" class="form_control" placeholder="Search here" name="search">
                        	<label><i class="fa fa-search"></i></label>
                        </div>
                    </form>
                </div>
            </div>
        </div><!--====== Search From ======-->

       

         <!-- Floating background shapes -->
            <div class="floating-shape shape1"></div>
            <div class="floating-shape shape2"></div>
            <div class="floating-shape shape3"></div>

            <div class="error-container">
                <h1 class="error-code">404</h1>
                <p class="error-message">Oops ! La page que vous cherchez n’existe pas ou a été déplacée.</p>
                <a href="/" class="btn btn-home">Retour à l'accueil</a>
            </div>


       
        <!--====== Start Footer Area  ======-->

        <div class="back-to-top"><i class="far fa-arrow-up"></i></div>

        <!--====== Aos js ======-->
        <script src="../common/js/plugins/aos.js"></script>
        <!--====== Main js ======-->
        <script src="../common/js/common_script.js"></script>
        <!--====== Main js ======-->
        <script src="assets/js/theme.js"></script>
    </body>
</html>
