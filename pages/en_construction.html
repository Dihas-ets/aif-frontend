<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page en construction</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    body {
      height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      text-align: center;
      background: linear-gradient(135deg, #e82c25, #ff6b6b);
      color: #fff;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }

    .construction-container {
      max-width: 600px;
    }

    .construction-img {
      width: 220px;
      animation: bounce 2s infinite;
    }

    @keyframes bounce {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-12px); }
    }

    h1 {
      font-size: 3rem;
      font-weight: bold;
    }

    p {
      font-size: 1.2rem;
      margin: 15px 0;
    }

    .btn-custom {
      background-color: #fff;
      color: #e82c25;
      font-weight: bold;
      padding: 10px 20px;
      border-radius: 30px;
      transition: 0.3s;
    }

    .btn-custom:hover {
      background-color: #f1f1f1;
      transform: scale(1.05);
    }
  </style>
</head>
<body>

  <div class="construction-container">
    <img src="https://cdn-icons-png.flaticon.com/512/5234/5234317.png" alt="En construction" class="construction-img mb-4">
    <h1>🚧 En construction</h1>
    <p>Cette page est actuellement en développement.<br>Revenez bientôt pour découvrir du nouveau contenu de formation 🎓.</p>
    <a href="/" class="btn btn-custom mt-3">Retour à l'accueil</a>
  </div>

</body>
</html>
